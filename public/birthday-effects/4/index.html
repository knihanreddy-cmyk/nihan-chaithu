<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Chaithrika Birthday 04 Fireworks Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Satisfy&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#0A1028; --night2:#141B3D;
  --gold:#FFD27A; --rose:#FF7EA8; --aqua:#7FE3F0; --silver:#EEF1FF;
  --ink:#E9ECFF;
}
html,body{background:#0A1028;color:#E9ECFF;margin:0;overflow:hidden;}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid #FFD27A;outline-offset:3px}

.intro{position:fixed;inset:0;overflow:hidden;z-index:1;transition:opacity .9s ease,transform 1.1s cubic-bezier(.6,0,.3,1);}
.intro.gone{opacity:0;transform:translateY(-4%) scale(1.02);pointer-events:none}

.sky{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 55% 40% at 80% 12%,rgba(176,186,255,.13),transparent 62%),
    radial-gradient(ellipse 90% 50% at 50% 110%,rgba(255,126,168,.08),transparent 70%),
    linear-gradient(180deg,#0A1028 0%,#111839 55%,#141B3D 80%,#1B2150 100%);}
.stars{position:absolute;inset:0 0 18% 0}
.st{position:absolute;border-radius:50%;background:#F4F6FF;opacity:.5;animation:tw var(--d,3s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes tw{from{opacity:.12;transform:scale(.7)}to{opacity:.95;transform:scale(1)}}
.moon{position:absolute;top:9%;right:12%;width:clamp(34px,4.6vw,62px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 36% 36%,#FFFDF0 0%,#F6EDCB 55%,#DCD2AE 100%);
  box-shadow:0 0 34px 8px rgba(255,240,205,.16),0 0 140px 50px rgba(150,165,255,.10);opacity:.92}
.moon::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 64% 60%,rgba(200,190,160,.35) 0 9%,transparent 10%),radial-gradient(circle at 40% 70%,rgba(200,190,160,.25) 0 6%,transparent 7%)}
.flash{position:absolute;inset:0;opacity:0;pointer-events:none}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:clamp(54px,13vh,120px);display:block}
.corner{position:absolute;bottom:-60px;width:220px;height:220px;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,210,122,.55),rgba(255,126,168,.18) 40%,transparent 70%)}
.corner.l{left:-90px}.corner.r{right:-90px}

#fx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:2}

.greet{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 16px;pointer-events:none}
.hb{margin:0;font-family:"Satisfy",cursive;font-weight:400;color:#FFD27A;
  font-size:clamp(30px,5.6vw,66px);line-height:1.1;
  text-shadow:0 0 14px rgba(255,210,122,.55),0 0 40px rgba(255,126,168,.25)}
.name{margin:.02em 0 0;font-family:"Cormorant Garamond",serif;font-weight:300;color:#FFF8EC;
  font-size:clamp(56px,13.5vw,176px);line-height:.95;letter-spacing:.015em;
  text-shadow:0 0 18px rgba(255,236,200,.55),0 0 48px rgba(255,210,122,.35),0 0 90px rgba(255,126,168,.22)}
.ch{display:inline-block;opacity:0;will-change:transform,opacity,filter}
.on .ch{animation:ink 1.25s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i) * 70ms + var(--d,0ms))}
.name .ch{--d:650ms}
@keyframes ink{
  0%{opacity:0;filter:blur(10px);transform:translateY(.18em) scale(1.12)}
  35%{opacity:1;filter:blur(0) brightness(2.2);text-shadow:0 0 22px #fff,0 0 50px #FFD27A,0 0 90px #FF7EA8}
  100%{opacity:1;filter:none;transform:none}
}
.sub{margin:clamp(14px,2.2vh,24px) 0 0;font-family:"Jost",sans-serif;font-weight:300;text-transform:uppercase;
  letter-spacing:.32em;font-size:clamp(10.5px,1.05vw,13px);color:rgba(233,236,255,.78);opacity:0}
.on .sub{animation:up 1.2s ease 1.9s forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.instant .ch,.instant .sub{animation:none!important;opacity:1!important}

.cta-wrap{margin-top:clamp(22px,4vh,40px);display:flex;flex-direction:column;align-items:center;gap:12px;
  opacity:0;transform:translateY(10px);visibility:hidden;transition:opacity .9s ease,transform .9s ease,visibility 0s .9s}
.cta-wrap.show{opacity:1;transform:none;visibility:visible;transition:opacity .9s ease,transform .9s ease,visibility 0s}
.cta{pointer-events:auto;font-family:"Jost",sans-serif;font-weight:400;letter-spacing:.16em;text-transform:uppercase;
  font-size:clamp(12px,1.1vw,14px);color:#FFE9BC;background:rgba(10,16,40,.4);
  border:1px solid rgba(255,210,122,.75);border-radius:999px;padding:15px 30px;
  box-shadow:0 0 18px rgba(255,210,122,.28),inset 0 0 14px rgba(255,210,122,.12);
  animation:breathe 2.8s ease-in-out infinite;transition:background .3s,color .3s}
.cta:hover{background:rgba(255,210,122,.14);color:#FFF6E2}
.cta span{display:inline-block;transition:transform .3s}
.cta:hover span{transform:translateX(4px)}
@keyframes breathe{50%{box-shadow:0 0 30px rgba(255,210,122,.5),0 0 60px rgba(255,126,168,.18),inset 0 0 18px rgba(255,210,122,.2)}}
.love{margin:0;font-family:"Satisfy",cursive;color:rgba(255,210,122,.8);font-size:clamp(17px,1.6vw,21px)}

.dawn{position:absolute;inset:0;z-index:4;opacity:0;pointer-events:none;transition:opacity 1.3s ease;
  background:linear-gradient(0deg,#FFD9B8 0%,#FFB8C6 28%,#C9A9D6 52%,#6E77B8 78%,#2B3470 100%)}
.intro.dawning .dawn{opacity:1}

.ctrl{position:absolute;z-index:5;top:max(16px,env(safe-area-inset-top));right:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-family:"Jost",sans-serif;font-weight:400;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(233,236,255,.82);background:rgba(10,16,40,.5);border:1px solid rgba(233,236,255,.2);
  border-radius:999px;padding:8px 13px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .3s,color .3s}
.pill:hover{border-color:rgba(255,210,122,.7);color:#FFE9BC}
.pill[aria-pressed="true"]{border-color:rgba(255,210,122,.6);color:#FFE9BC}

.site{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:0 16px;text-align:center;color:#2A2547;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,#FFE3D3,transparent 70%),linear-gradient(180deg,#FFF3EA,#FBE7EE);
  animation:siteIn 1s ease both}
@keyframes siteIn{from{opacity:0}to{opacity:1}}
.site small{font-family:"Jost",sans-serif;letter-spacing:.3em;text-transform:uppercase;font-size:11px;color:#8A5B6E}
.site h2{margin:0;font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(28px,4.4vw,52px);line-height:1.1;max-width:18ch;color:#2A2547}
.site h2 em{font-style:italic;color:#B0466D}
.site button{font-family:"Jost",sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:12px;
  color:#FFF3EA;background:#2A2547;border:0;border-radius:999px;padding:14px 26px}
.site button:hover{background:#3C3566}

@media (prefers-reduced-motion:reduce){
  .st,.cta{animation:none}
  .on .ch{animation:fadeOnly 1.2s ease forwards;animation-delay:0s}
  .on .sub{animation:fadeOnly 1.2s ease .4s forwards}
  @keyframes fadeOnly{from{opacity:0}to{opacity:1}}
  .intro,.dawn,.cta-wrap{transition:opacity .6s ease}
  .intro.gone{transform:none}
}
</style>

<div class="intro" id="intro">
  <div class="sky" aria-hidden="true">
    <div class="stars" id="stars"></div>
    <div class="moon"></div>
    <div class="flash" id="flash"></div>
    <svg class="hills" viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0 120V64C90 52 170 44 270 52S440 74 560 70 760 46 880 50s200 26 320 22 180-28 240-26V120Z" fill="#0B1230"/>
      <path d="M0 120V84c60-6 120-20 200-16s150 22 250 20 170-24 280-22 170 20 280 18 190-22 280-20 110 10 150 12V120Z" fill="#060A1E"/>
    </svg>
    <span class="corner l" id="cl"></span><span class="corner r" id="cr"></span>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <main class="greet" id="greet">
    <p class="hb" id="hb">Happy Birthday,</p>
    <h1 class="name" id="nm">Chaithrika</h1>
    <p class="sub">A little gift, made just for you</p>
    <div class="cta-wrap" id="ctaWrap">
      <button class="cta" id="cta" type="button">Enter your website <span aria-hidden="true">&rarr;</span></button>
      <p class="love">With love</p>
    </div>
  </main>
  <div class="dawn" aria-hidden="true"></div>
  <nav class="ctrl" aria-label="Opening controls">
    <button class="pill" id="skip" type="button">Skip</button>
    <button class="pill" id="replay" type="button">Replay</button>
    <button class="pill" id="snd" type="button" aria-pressed="false">Sound off</button>
  </nav>
</div>

<section class="site" id="site" hidden>
  <small>Your website opens here</small>
  <h2>The homepage <em>(Glass Portals)</em> would load now</h2>
  <button id="again" type="button">Replay the opening</button>
</section>

<script>
(function(){
  var $ = function(s){return document.querySelector(s);};
  var intro=$('#intro'), cv=$('#fx'), ctx=cv.getContext('2d'), greet=$('#greet'), ctaWrap=$('#ctaWrap'),
      flashEl=$('#flash'), site=$('#site'), sndBtn=$('#snd');
  var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,DPR=1,small=false;

  var GOLD=[255,210,122], ROSE=[255,126,168], AQUA=[127,227,240], SILVER=[238,241,255], WHITE=[255,250,240];

  function rand(a,b){return a+Math.random()*(b-a);}
  function rgb(c){return 'rgb('+c[0]+','+c[1]+','+c[2]+')';}

  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=window.innerWidth;H=window.innerHeight;
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    small=W<640;
    if(RM) staticSprinkle();
  }

  /* stars */
  (function(){
    var box=$('#stars'), n=window.innerWidth<640?55:110, frag=document.createDocumentFragment();
    for(var i=0;i<n;i++){
      var s=document.createElement('span'); s.className='st';
      var z=Math.random()<.85?rand(1,1.8):rand(2,2.8);
      s.style.cssText='left:'+rand(0,100).toFixed(2)+'%;top:'+rand(0,100).toFixed(2)+'%;width:'+z.toFixed(1)+'px;height:'+z.toFixed(1)+'px;--d:'+rand(1.8,4.5).toFixed(2)+'s;--dl:'+rand(0,4).toFixed(2)+'s';
      frag.appendChild(s);
    }
    box.appendChild(frag);
  })();

  /* split letters */
  function split(el){
    var t=el.textContent; el.textContent=''; el.setAttribute('aria-label',t.replace(/,$/,', '));
    for(var i=0;i<t.length;i++){
      var s=document.createElement('span'); s.className='ch'; s.setAttribute('aria-hidden','true');
      s.style.setProperty('--i',i); s.textContent=t[i]===' '?' ':t[i]; el.appendChild(s);
    }
  }
  split($('#hb')); split($('#nm'));

  /* ---------- audio ---------- */
  var actx=null, master=null, noise=null, soundOn=false, lastCrackle=0;
  function ensureAudio(){
    if(!actx){
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      actx=new AC(); master=actx.createGain(); master.gain.value=.45; master.connect(actx.destination);
      noise=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);
      var d=noise.getChannelData(0); for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    if(actx.state==='suspended') actx.resume();
    return actx;
  }
  function setSound(on){
    soundOn=!!on; if(on) ensureAudio();
    sndBtn.textContent=soundOn?'Sound on':'Sound off';
    sndBtn.setAttribute('aria-pressed',soundOn?'true':'false');
  }
  function nsrc(){var n=actx.createBufferSource(); n.buffer=noise; return n;}
  function thump(){
    if(!soundOn||!actx) return;
    var t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(36,t+.4);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.32,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+.55);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+.6);
    var n=nsrc(), f=actx.createBiquadFilter(), ng=actx.createGain();
    f.type='lowpass'; f.frequency.value=800;
    ng.gain.setValueAtTime(.14,t); ng.gain.exponentialRampToValueAtTime(.0001,t+.45);
    n.connect(f); f.connect(ng); ng.connect(master); n.start(t); n.stop(t+.5);
  }
  function whoosh(){
    if(!soundOn||!actx) return;
    var t=actx.currentTime, n=nsrc(), f=actx.createBiquadFilter(), g=actx.createGain();
    f.type='bandpass'; f.Q.value=1.2; f.frequency.setValueAtTime(350,t); f.frequency.exponentialRampToValueAtTime(2400,t+.9);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.25); g.gain.exponentialRampToValueAtTime(.0001,t+.95);
    n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+1);
  }
  function crackle(){
    if(!soundOn||!actx) return;
    var now=performance.now(); if(now-lastCrackle<220) return; lastCrackle=now;
    var t=actx.currentTime;
    for(var i=0;i<9;i++){
      var t0=t+Math.random()*.4, n=nsrc(), f=actx.createBiquadFilter(), g=actx.createGain();
      f.type='highpass'; f.frequency.value=2800;
      g.gain.setValueAtTime(.05,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.03);
      n.connect(f); f.connect(g); g.connect(master); n.start(t0,Math.random()*.5); n.stop(t0+.04);
    }
  }
  function chime(){
    if(!soundOn||!actx) return;
    var t=actx.currentTime, notes=[784,988,1175,1568];
    notes.forEach(function(fq,i){
      var o=actx.createOscillator(), g=actx.createGain(), t0=t+i*.11;
      o.type='sine'; o.frequency.value=fq;
      g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.07,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+1.4);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+1.5);
    });
  }

  /* ---------- particles ---------- */
  var rockets=[], parts=[], running=false, last=0, idle=0, raf=0;
  function cap(){return small?1500:3400;}
  function add(p){ if(parts.length<cap()) parts.push(p); }
  function P(x,y,vx,vy,o){
    return {x:x,y:y,px:x,py:y,vx:vx,vy:vy,g:o.g||.045,drag:o.drag||.96,life:o.life,max:o.life,
      c:o.c,w:o.w||2,flick:!!o.flick,trail:!!o.trail,crack:!!o.crack,soft:!!o.soft};
  }

  function launch(side,tx,ty,type,cols,delay){
    var x0=side<0?8:W-8, y0=H+6, T=rand(54,66), g=.12;
    rockets.push({x:x0,y:y0,px:x0,py:y0,vx:(tx-x0)/T,vy:(ty-y0-.5*g*T*T)/T,g:g,t:0,T:T,type:type,cols:cols});
    var c=side<0?$('#cl'):$('#cr');
    if(c.animate) c.animate([{opacity:0},{opacity:1},{opacity:0}],{duration:800,easing:'ease-out'});
    whoosh(); kick();
  }
  function pair(lx,ly,rx,ry,type,cl,cr){
    launch(-1,lx*W,ly*H,type,cl);
    launch(1,rx*W,ry*H,type,cr);
  }

  function flash(x,y,c){
    flashEl.style.background='radial-gradient(circle at '+x+'px '+y+'px, rgba('+c[0]+','+c[1]+','+c[2]+',.20), rgba('+c[0]+','+c[1]+','+c[2]+',.05) 30%, transparent 60%)';
    if(flashEl.animate) flashEl.animate([{opacity:0},{opacity:1,offset:.12},{opacity:0}],{duration:900,easing:'ease-out'});
  }

  function explode(x,y,type,cols){
    var m=Math.min(W,H*1.15), c1=cols[0], c2=cols[1], n=small?80:170, i,a,s,d,vmax;
    flash(x,y,c1); thump();
    // core glint
    for(i=0;i<14;i++){a=rand(0,6.283);s=rand(.5,2.2);add(P(x,y,Math.cos(a)*s,Math.sin(a)*s,{c:WHITE,life:rand(10,18),w:2.6,g:0,drag:.9}));}
    if(type==='peony'){
      d=.96; vmax=m*.25*(1-d);
      for(i=0;i<n;i++){a=rand(0,6.283);s=vmax*(.35+.65*Math.sqrt(Math.random()));
        add(P(x,y,Math.cos(a)*s,Math.sin(a)*s,{c:Math.random()<.72?c1:c2,life:rand(58,86),w:rand(1.6,2.4),drag:d,g:.045,flick:Math.random()<.2}));}
    } else if(type==='ring'){
      d=.962; vmax=m*.22*(1-d); var k=Math.round(n*.6), tilt=rand(.55,.8);
      for(i=0;i<k;i++){a=i/k*6.283;s=vmax*rand(.96,1.04);
        add(P(x,y,Math.cos(a)*s,Math.sin(a)*s*tilt,{c:c1,life:rand(60,78),w:2,drag:d,g:.035}));}
      for(i=0;i<Math.round(n*.3);i++){a=rand(0,6.283);s=vmax*rand(.1,.45);
        add(P(x,y,Math.cos(a)*s,Math.sin(a)*s,{c:c2,life:rand(45,65),w:1.8,drag:d,g:.04,flick:true}));}
    } else if(type==='willow'){
      d=.972; vmax=m*.24*(1-d);
      for(i=0;i<Math.round(n*.75);i++){a=rand(0,6.283);s=vmax*(.3+.7*Math.sqrt(Math.random()));
        add(P(x,y,Math.cos(a)*s,Math.sin(a)*s-.4,{c:GOLD,life:rand(130,180),w:1.7,drag:d,g:.028,trail:true,soft:true,flick:Math.random()<.3}));}
    } else if(type==='crackle'){
      d=.955; vmax=m*.2*(1-d);
      for(i=0;i<Math.round(n*.55);i++){a=rand(0,6.283);s=vmax*(.3+.7*Math.random());
        add(P(x,y,Math.cos(a)*s,Math.sin(a)*s,{c:Math.random()<.6?SILVER:c1,life:rand(36,58),w:1.8,drag:d,g:.05,crack:true}));}
    }
    kick();
  }

  function kick(){ if(!running){ running=true; idle=0; last=performance.now(); raf=requestAnimationFrame(frame);} }

  function frame(now){
    if(!running) return;
    var dt=Math.min(3,(now-last)/16.667); last=now;
    ctx.globalCompositeOperation='destination-out';
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(0,0,0,'+(1-Math.pow(.8,dt)).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round';

    // rockets
    for(var r=rockets.length-1;r>=0;r--){
      var R=rockets[r];
      R.px=R.x;R.py=R.y; R.x+=R.vx*dt; R.y+=R.vy*dt; R.vy+=R.g*dt; R.t+=dt;
      for(var e=0;e<2;e++) add(P(R.x+rand(-1,1),R.y+rand(0,3),rand(-.4,.4)-R.vx*.08,rand(.2,1.1),{c:Math.random()<.7?GOLD:WHITE,life:rand(16,30),w:rand(1,1.8),g:.03,drag:.94,flick:true}));
      ctx.globalAlpha=.9; ctx.strokeStyle='rgb(255,244,220)'; ctx.lineWidth=2.6;
      ctx.beginPath(); ctx.moveTo(R.px,R.py); ctx.lineTo(R.x,R.y); ctx.stroke();
      ctx.globalAlpha=.22; ctx.fillStyle=rgb(R.cols[0]);
      ctx.beginPath(); ctx.arc(R.x,R.y,7,0,6.283); ctx.fill();
      if(R.t>=R.T){ rockets.splice(r,1); explode(R.x,R.y,R.type,R.cols); }
    }

    // particles
    var j=0, df;
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      p.px=p.x;p.py=p.y;
      df=Math.pow(p.drag,dt);
      p.vx*=df; p.vy=p.vy*df+p.g*dt;
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
      if(p.life<=0){
        if(p.crack){
          for(var q=0;q<3;q++){var aa=rand(0,6.283),ss=rand(.6,1.6);
            add(P(p.x,p.y,Math.cos(aa)*ss,Math.sin(aa)*ss,{c:WHITE,life:rand(6,12),w:1.4,g:0,drag:.9}));}
          crackle();
        }
        continue;
      }
      if(p.trail && Math.random()<.4*dt) add(P(p.x,p.y,0,.15,{c:[255,190,100],life:rand(20,34),w:1.1,g:.012,drag:.9}));
      var lf=p.life/p.max, al=p.soft?Math.min(1,lf*1.6):lf*lf*(3-2*lf);
      if(p.flick && Math.random()<.35) al*=.35;
      ctx.globalAlpha=al; ctx.strokeStyle=rgb(p.c); ctx.lineWidth=p.w;
      ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x,p.y); ctx.stroke();
      parts[j++]=p;
    }
    parts.length=j;
    ctx.globalAlpha=1;

    if(rockets.length||parts.length) idle=0; else idle+=dt;
    if(idle>45){ running=false; ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,W,H); return; }
    raf=requestAnimationFrame(frame);
  }

  function clearFx(){
    rockets=[]; parts=[]; running=false; cancelAnimationFrame(raf);
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1; ctx.clearRect(0,0,W,H);
  }

  function staticSprinkle(){
    ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,W,H);
    var cols=[GOLD,ROSE,AQUA,SILVER], n=small?40:80;
    for(var i=0;i<n;i++){
      var side=i%2?1:-1, x=side<0?rand(0,W*.3):rand(W*.7,W), y=rand(H*.05,H*.85), c=cols[i%4];
      ctx.globalAlpha=rand(.35,.85); ctx.fillStyle=rgb(c);
      ctx.beginPath(); ctx.arc(x,y,rand(1,2.4),0,6.283); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  /* glints along letters = written in sparkles */
  function glintLetters(sel,base){
    var chs=document.querySelectorAll(sel);
    for(var i=0;i<chs.length;i++)(function(el,i){
      at(base+i*70+120,function(){
        var b=el.getBoundingClientRect(); if(!b.width) return;
        var cx=b.left+b.width/2, cy=b.top+b.height*.55, n=small?5:9;
        for(var k=0;k<n;k++){var a=rand(0,6.283),s=rand(.4,1.8);
          add(P(cx+rand(-b.width*.4,b.width*.4),cy+rand(-b.height*.3,b.height*.3),Math.cos(a)*s,Math.sin(a)*s,{c:Math.random()<.5?GOLD:WHITE,life:rand(18,36),w:rand(1.2,2),g:.015,drag:.93,flick:true}));}
        kick();
      });
    })(chs[i],i);
  }

  /* ---------- sequence ---------- */
  var timers=[];
  function at(ms,fn){timers.push(setTimeout(fn,ms));}
  function clearTimers(){timers.forEach(clearTimeout);timers=[];}

  function reveal(instant){
    greet.classList.remove('on','instant'); void greet.offsetWidth;
    greet.classList.add('on'); if(instant) greet.classList.add('instant');
    if(!instant && !RM){ glintLetters('#hb .ch',0); glintLetters('#nm .ch',650); }
  }
  function showCTA(){ ctaWrap.classList.add('show'); }

  function finale(){
    var types=['willow','peony','crackle'], colsL=[[GOLD,GOLD],[ROSE,GOLD],[SILVER,AQUA]], colsR=[[GOLD,GOLD],[AQUA,SILVER],[SILVER,ROSE]];
    for(var i=0;i<3;i++)(function(i){
      at(i*200,function(){
        launch(-1,W*(.16+i*.11),H*(.17+(i%2)*.09),types[i],colsL[i]);
        launch(1,W*(.84-i*.11),H*(.17+(i%2)*.09),types[i],colsR[i]);
      });
    })(i);
    at(900,function(){ pair(.3,.14,.7,.14,'willow',[GOLD,GOLD],[GOLD,GOLD]); });
  }

  function reset(){
    clearTimers(); clearFx();
    greet.classList.remove('on','instant'); ctaWrap.classList.remove('show');
    intro.classList.remove('dawning','gone'); intro.hidden=false; site.hidden=true;
  }

  function play(){
    reset(); resize();
    if(RM){ staticSprinkle(); reveal(true); greet.classList.remove('instant'); showCTA(); return; }
    at(450,function(){ pair(.33,.32,.67,.28,'peony',[ROSE,GOLD],[AQUA,SILVER]); });
    at(1650,function(){ pair(.2,.22,.8,.24,'ring',[AQUA,ROSE],[GOLD,AQUA]); });
    at(2900,finale);
    at(3500,function(){ reveal(false); });
    at(5300,showCTA);
    at(5700,function(){ pair(.12,.34,.88,.32,'crackle',[GOLD,ROSE],[GOLD,AQUA]); });
    at(7600,function(){ pair(.24,.18,.76,.2,'peony',[ROSE,SILVER],[GOLD,ROSE]); });
  }

  function skip(){
    clearTimers(); clearFx();
    if(RM) staticSprinkle();
    reveal(true); showCTA();
  }

  function exit(){
    clearTimers(); chime();
    if(!RM){ explode(W*.5,H*.3,'willow',[GOLD,GOLD]); }
    intro.classList.add('dawning');
    at(1100,function(){ intro.classList.add('gone'); });
    at(2000,function(){ clearFx(); intro.hidden=true; site.hidden=false; $('#again').focus({preventScroll:true}); });
  }

  /* ---------- wiring ---------- */
  document.addEventListener('pointerdown',function(e){
    if(e.target.closest && e.target.closest('#snd')) return;
    if(!actx) setSound(true);
  });
  sndBtn.addEventListener('click',function(){ setSound(!soundOn); });
  $('#skip').addEventListener('click',skip);
  $('#replay').addEventListener('click',function(){ setSound(true); play(); });
  $('#cta').addEventListener('click',exit);
  $('#again').addEventListener('click',function(){ setSound(true); play(); });
  var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(resize,120); });

  resize();
  play();
})();
</script>
