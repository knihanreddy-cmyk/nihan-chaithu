<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Chaithrika Birthday 10 Runway Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
html,body{background:#060606;color:#F3E3B5;margin:0;height:100%;overflow:hidden}
body{font-family:'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
[hidden]{display:none!important}
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}

.stage{position:fixed;inset:0;overflow:hidden;--sw:clamp(150px,30vw,460px);
  background:radial-gradient(ellipse 70% 50% at 50% 36%,#17130f 0%,#0b0a09 45%,#060606 75%)}
.backglow{position:absolute;left:50%;top:40vh;width:min(92vw,960px);height:28vh;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(243,227,181,.2),rgba(243,227,181,0) 65%);opacity:.4;transition:opacity 1.2s ease}
.lit .backglow{opacity:.75}
.aim .backglow{opacity:1}
.walk{position:absolute;left:50%;bottom:0;width:min(84vw,900px);height:60vh;transform:translateX(-50%);z-index:1}
.rail{stroke:#F3E3B5;stroke-width:3;stroke-dasharray:.5 13;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.18;transition:opacity .8s ease}
.lit .rail{opacity:.85}
.pool{position:absolute;left:50%;bottom:3vh;width:min(86vw,760px);height:24vh;transform:translateX(-50%);z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(243,227,181,.34),rgba(243,227,181,0) 68%);opacity:0;transition:opacity 1.2s ease .3s}
.aim .pool{opacity:1}

/* name behind her */
.name{position:absolute;left:50%;top:45%;z-index:2;margin:0;white-space:nowrap;pointer-events:none;
  font-family:'Bodoni Moda',Didot,serif;font-style:italic;font-weight:500;font-size:clamp(56px,min(18vw,30vh),250px);line-height:1.1;letter-spacing:-.01em;padding:0 .1em;
  background:linear-gradient(100deg,#B76E79 0%,#C98A7A 18%,#F3E3B5 38%,#FFFFFF 48%,#E8E8E8 56%,#F3E3B5 70%,#C98A7A 100%);
  background-size:220% 100%;background-position:0 0;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  transform:translate(-50%,-50%);opacity:0}
.nm .name{opacity:1;animation:nameIn 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes nameIn{0%{opacity:0;transform:translate(-50%,-50%) scale(1.12);filter:blur(14px);background-position:100% 0}
  100%{opacity:1;transform:translate(-50%,-50%);filter:blur(0);background-position:0 0}}

/* model */
.model{position:absolute;left:50%;bottom:0;height:min(80vh,160vw);width:auto;aspect-ratio:915/1600;z-index:3;pointer-events:none;
  transform-origin:50% 100%;transform:translate(-50%,-30vh) scale(.55);opacity:.85;
  filter:brightness(.18) drop-shadow(0 0 16px rgba(243,227,181,.22));
  -webkit-mask-image:linear-gradient(#000 72%,transparent 98%);mask-image:linear-gradient(#000 72%,transparent 98%)}
.walk-on .model{transform:translate(-50%,0) scale(1);opacity:1;filter:brightness(1) drop-shadow(0 0 28px rgba(243,227,181,.25));
  animation:walkin 1.8s cubic-bezier(.3,.1,.35,1) both}
@keyframes walkin{
  0%{transform:translate(-50%,-30vh) scale(.55);opacity:.85;filter:brightness(.18) drop-shadow(0 0 16px rgba(243,227,181,.22))}
  16%{transform:translate(-50%,-25vh) scale(.62)}
  30%{transform:translate(-50%,-21.5vh) scale(.68)}
  46%{transform:translate(-50%,-15vh) scale(.76)}
  60%{transform:translate(-50%,-11.5vh) scale(.83)}
  76%{transform:translate(-50%,-6vh) scale(.91)}
  90%{transform:translate(-50%,-3vh) scale(.965)}
  100%{transform:translate(-50%,0) scale(1);opacity:1;filter:brightness(1) drop-shadow(0 0 28px rgba(243,227,181,.25))}}

/* spotlights */
.spot{position:absolute;top:-6vh;width:var(--sw);height:130vh;margin-left:calc(var(--sw) / -2);z-index:4;pointer-events:none;
  transform-origin:50% 0;transform:rotate(var(--a,0deg));mix-blend-mode:screen;opacity:.4;filter:blur(9px);
  transition:transform 1s cubic-bezier(.45,0,.2,1),opacity .6s ease}
.spot.l{left:14%}
.spot.r{left:86%}
.spot::before{content:"";position:absolute;inset:0;clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);
  background:linear-gradient(to bottom,rgba(255,247,228,.7),rgba(255,240,212,.22) 50%,rgba(255,240,212,0) 82%)}
.go .spot{opacity:.75}
.aim .spot{opacity:1;transition:transform 1.15s cubic-bezier(.55,0,.15,1),opacity .6s ease}
.fog{position:absolute;left:0;right:0;bottom:0;height:40vh;z-index:4;pointer-events:none;
  background:linear-gradient(to top,rgba(6,6,6,.94) 0%,rgba(6,6,6,.62) 42%,rgba(6,6,6,0))}

/* type */
.top{position:absolute;left:0;right:0;top:clamp(60px,11vh,124px);z-index:5;text-align:center;padding:0 16px}
.hb{display:inline-flex;align-items:center;gap:clamp(12px,2vw,22px);margin:0;font:500 clamp(12px,1.25vw,16px)/1 'Montserrat',sans-serif;
  letter-spacing:.55em;text-transform:uppercase;color:#F3E3B5;opacity:0;transform:translateY(10px);transition:opacity 1s ease,transform 1s ease}
.hb .t{padding-left:.55em}
.hb::before,.hb::after{content:"";width:clamp(22px,6vw,84px);height:1px;background:linear-gradient(90deg,rgba(243,227,181,0),#F3E3B5)}
.hb::after{transform:scaleX(-1)}
.hbon .hb{opacity:1;transform:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.bottom{position:absolute;left:0;right:0;bottom:max(22px,4.5vh);z-index:5;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 16px;text-align:center}
.ready{margin:0;font:500 clamp(11px,1.1vw,14px)/1.4 'Montserrat',sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#E8E8E8;padding-left:.34em;
  opacity:0;transform:translateY(8px);transition:opacity .9s ease,transform .9s ease}
.rdy .ready{opacity:1;transform:none}
.cta{font:500 clamp(12px,1.15vw,14px)/1 'Montserrat',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#FFFFFF;
  background:rgba(6,6,6,.35);border:1px solid #FFFFFF;border-radius:0;padding:18px 30px;cursor:pointer;
  opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .8s ease,transform .8s ease,background .25s ease,color .25s ease}
.ctaon .cta{opacity:1;visibility:visible;transform:none}
.cta:hover{background:#FFFFFF;color:#060606}
.cta:focus-visible{outline:2px solid #F3E3B5;outline-offset:5px}
.sign{margin:0;font:italic 400 clamp(15px,1.4vw,18px)/1 'Bodoni Moda',serif;color:#C98A7A;opacity:0;transition:opacity 1s ease .4s}
.ctaon .sign{opacity:1}

/* countdown */
.count{position:absolute;left:50%;top:45%;width:clamp(190px,38vmin,360px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:6;
  display:grid;place-items:center;opacity:0;transition:opacity .5s ease;pointer-events:none}
.counting .count{opacity:1}
.count .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(232,232,232,.35)}
.count .ring.in{inset:8%;border-color:rgba(232,232,232,.16)}
.count .cross{position:absolute;inset:0;
  background:linear-gradient(rgba(232,232,232,.2),rgba(232,232,232,.2)) 50% 0/1px 100% no-repeat,
             linear-gradient(90deg,rgba(232,232,232,.2),rgba(232,232,232,.2)) 0 50%/100% 1px no-repeat}
.count .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(243,227,181,.2) var(--p),rgba(243,227,181,0) var(--p))}
.tick .sweep{animation:sweep .9s linear both}
@keyframes sweep{from{--p:0%}to{--p:100%}}
.num{position:relative;font-family:'Bodoni Moda',serif;font-weight:500;font-size:clamp(108px,26vmin,260px);line-height:1;color:#F3E3B5;opacity:0}
.tick .num{animation:strobe .9s ease-out both}
@keyframes strobe{
  0%{opacity:0;transform:scale(1.3);color:#FFFFFF;text-shadow:0 0 40px rgba(255,255,255,.9)}
  10%{opacity:1}
  60%{opacity:1;transform:scale(1);color:#F3E3B5;text-shadow:0 0 0 rgba(255,255,255,0)}
  100%{opacity:0;transform:scale(.97)}}
.dots{position:absolute;top:calc(100% + 18px);left:50%;transform:translateX(-50%);font:500 12px/1 'Montserrat',sans-serif;letter-spacing:.4em;
  color:rgba(232,232,232,.35);white-space:nowrap;padding-left:.4em}
.dots span{transition:color .2s}
.dots span.on{color:#FFFFFF}

/* flashes */
.flash{position:absolute;inset:0;background:#FFFFFF;opacity:0;z-index:9;pointer-events:none}
.flash.on{animation:flash .42s ease-out both}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.cam{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);z-index:7;pointer-events:none;opacity:0;
  animation:cam .5s ease-out forwards}
.cam::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,#FFFFFF 0 8%,rgba(255,255,255,.75) 15%,rgba(255,255,255,0) 60%)}
.cam::after{content:"";position:absolute;inset:-45%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9) 50%,rgba(255,255,255,0)) 50% 50%/100% 2px no-repeat,
             linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.9) 50%,rgba(255,255,255,0)) 50% 50%/2px 100% no-repeat}
@keyframes cam{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.cflash{position:absolute;bottom:0;width:70vmin;height:70vmin;z-index:6;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--cx) 100%,rgba(255,255,255,.9),rgba(243,227,181,.35) 18%,rgba(243,227,181,0) 55%)}
.cflash.l{left:0;--cx:0%}
.cflash.r{right:0;--cx:100%}
.cflash.on{animation:cflash .8s ease-out both}
@keyframes cflash{0%{opacity:1}100%{opacity:0}}

canvas#fx{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}

/* gate */
.gate{position:absolute;left:0;right:0;bottom:max(28px,7vh);z-index:10;display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:0 16px;text-align:center;transition:opacity .6s ease,transform .6s ease}
.go .gate{opacity:0;transform:translateY(12px);pointer-events:none}
.kicker{margin:0;font:500 clamp(11px,1.1vw,13px)/1.5 'Montserrat',sans-serif;letter-spacing:.42em;text-transform:uppercase;color:#E8E8E8;padding-left:.42em}
.lights{position:relative;width:clamp(118px,15vmin,150px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(243,227,181,.75);cursor:pointer;
  background:radial-gradient(circle at 50% 38%,rgba(243,227,181,.18),rgba(6,6,6,.7) 72%);color:#F3E3B5;
  font:italic 500 clamp(24px,2.6vw,30px)/1 'Bodoni Moda',serif;transition:background .3s ease,color .3s ease}
.lights::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(243,227,181,.4);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.28);opacity:0}}
.lights:hover{background:radial-gradient(circle at 50% 38%,rgba(243,227,181,.38),rgba(6,6,6,.6) 75%);color:#FFFFFF}
.lights:focus-visible{outline:2px solid #FFFFFF;outline-offset:8px}
.hint{margin:0;font:500 11px/1 'Montserrat',sans-serif;letter-spacing:.26em;text-transform:uppercase;color:rgba(232,232,232,.6);padding-left:.26em}

.blackout{position:absolute;inset:0;background:#000000;opacity:0;z-index:15;pointer-events:none}
.cut .blackout{opacity:1;transition:opacity .07s linear}

/* controls */
.ctrls{position:fixed;top:14px;right:16px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cbtn{font:500 11px/1 'Montserrat',sans-serif;letter-spacing:.16em;text-transform:uppercase;background:rgba(6,6,6,.55);color:#E8E8E8;
  border:1px solid rgba(232,232,232,.45);border-radius:999px;padding:9px 13px;cursor:pointer}
.cbtn:hover{border-color:#FFFFFF;color:#FFFFFF}
.cbtn.link{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px}
.cbtn:focus-visible{outline:2px solid #F3E3B5;outline-offset:2px}

/* end */
.end{position:fixed;inset:0;z-index:40;background:#060606;color:#F3E3B5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;text-align:center;padding:24px 16px;box-sizing:border-box;opacity:0;transition:opacity 1s ease}
.end.show{opacity:1}
.end .lbl{margin:0;font:500 12px/1 'Montserrat',sans-serif;letter-spacing:.4em;text-transform:uppercase;color:#C98A7A;padding-left:.4em}
.end h2{margin:0;font:italic 500 clamp(34px,5.5vw,72px)/1.05 'Bodoni Moda',serif;color:#F3E3B5;max-width:14ch}
.end p{margin:0;font:400 clamp(14px,1.3vw,16px)/1.5 'Montserrat',sans-serif;color:#E8E8E8;max-width:36ch}
.end .cta{opacity:1;visibility:visible;transform:none;margin-top:10px}

/* skip / reduced */
.skip .model,.skip .name,.skip .spot,.skip .hb,.skip .ready,.skip .cta,.skip .sign,.skip .pool,.skip .backglow,.skip .count,.skip .gate{animation:none!important;transition:none!important}
.rm .model,.rm .name,.rm .spot,.rm .lights::before{animation:none!important}
.rm .spot{transition:none!important}
.rm .model,.rm .name,.rm .hb,.rm .ready,.rm .cta,.rm .sign,.rm .pool{transition:opacity 1s ease!important}
@media (prefers-reduced-motion:reduce){.lights::before{animation:none}}
@media (max-height:560px){.count{width:clamp(150px,34vmin,260px)}.num{font-size:clamp(80px,22vmin,180px)}.top{top:52px}}
</style>

<div class="stage" id="stage">
  <div class="backglow"></div>
  <svg class="walk" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0c0c"/><stop offset=".65" stop-color="#211f1c"/><stop offset="1" stop-color="#34302b"/></linearGradient>
      <linearGradient id="wr" x1="0" y1="0" x2="1" y2="0"><stop offset=".3" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#F3E3B5" stop-opacity=".16"/><stop offset=".7" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    </defs>
    <polygon points="44,0 56,0 100,100 0,100" fill="url(#wg)"/>
    <polygon points="47,0 53,0 72,100 28,100" fill="url(#wr)"/>
    <line class="rail" x1="44" y1="0" x2="0" y2="100"/>
    <line class="rail" x1="56" y1="0" x2="100" y2="100"/>
  </svg>
  <div class="pool"></div>

  <p class="name" aria-hidden="true">Chaithrika</p>
  <img class="model" src="/images/designs/runway-cutout.png" alt="Chaithrika on the runway">

  <div class="spot l" id="spL"></div>
  <div class="spot r" id="spR"></div>
  <div class="fog"></div>

  <div class="top"><h1 class="hb"><span class="t">Happy Birthday</span><span class="sr">, Chaithrika</span></h1></div>

  <div class="count" id="count" aria-hidden="true">
    <div class="sweep"></div><div class="ring"></div><div class="ring in"></div><div class="cross"></div>
    <div class="num" id="num">3</div>
    <div class="dots"><span data-n="3">3</span> · <span data-n="2">2</span> · <span data-n="1">1</span></div>
  </div>

  <div class="bottom">
    <p class="ready">Your portfolio is ready</p>
    <button class="cta" id="cta" type="button">Enter your website &rarr;</button>
    <p class="sign">With love</p>
  </div>

  <div class="cflash l" id="cfl"></div><div class="cflash r" id="cfr"></div>
  <div id="cams"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="flash" id="flash"></div>

  <div class="gate" id="gate">
    <p class="kicker">A little gift, made just for you</p>
    <button class="lights" id="lights" type="button" aria-label="Lights. Open your gift">Lights</button>
    <p class="hint">Tap to open your gift</p>
  </div>

  <div class="blackout"></div>
</div>

<div class="ctrls" id="ctrls" hidden>
  <button class="cbtn" id="snd" type="button" aria-pressed="false">Sound off</button>
  <button class="cbtn" id="rep" type="button">Replay</button>
  <button class="cbtn link" id="skp" type="button">Skip</button>
</div>

<div class="end" id="end" hidden>
  <p class="lbl">Lights up</p>
  <h2>Your website opens here</h2>
  <p>The homepage (Glass Portals) would load now.</p>
  <button class="cta" id="again" type="button">Replay the opening</button>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var stage=$('#stage'),cv=$('#fx'),ctx=cv.getContext('2d'),gate=$('#gate'),lights=$('#lights'),count=$('#count'),num=$('#num'),
      flashEl=$('#flash'),cams=$('#cams'),cfl=$('#cfl'),cfr=$('#cfr'),spL=$('#spL'),spR=$('#spR'),cta=$('#cta'),endEl=$('#end'),
      ctrls=$('#ctrls'),sndBtn=$('#snd'),repBtn=$('#rep'),skpBtn=$('#skp'),again=$('#again');
  var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- canvas ---------- */
  var W=0,H=0,DPR=1,S=1,small=false;
  function size(){
    W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
    S=Math.max(.62,Math.min(1.2,Math.min(W,H)/800));small=W<700||Math.min(W,H)<520;
  }
  size();
  var PAL=[[232,232,232],[243,227,181],[201,138,122],[255,255,255],[183,110,121]];
  function rnd(a,b){return a+Math.random()*(b-a)}
  var parts=[],running=false,last=0,acc=0;
  function reachMax(){return Math.max(H,W*.6)*.95}
  function emit(side,nFoil,nSpark,power){
    var ox=side<0?6:W-6,oy=H+4,base=side<0?-58:-122,i,a,decay,v0;
    for(i=0;i<nFoil;i++){
      a=(base+rnd(-20,20))*Math.PI/180;decay=rnd(.935,.955);v0=reachMax()*power*rnd(.3,1)*(1-decay);
      parts.push({k:Math.random()<.72?0:1,x:ox,y:oy,vx:Math.cos(a)*v0,vy:Math.sin(a)*v0,decay:decay,fall:0,term:rnd(1.8,3.4)*S,
        wob:rnd(0,6.28),wobS:rnd(.05,.11),sway:rnd(.3,1.3)*S,rot:rnd(0,6.28),spin:rnd(-.2,.2),tilt:rnd(0,6.28),tiltS:rnd(.09,.22),
        c:PAL[Math.floor(Math.random()*5)],sz:rnd(.8,1.3)*S,life:0,max:9999});
    }
    for(i=0;i<nSpark;i++){
      a=(base+rnd(-26,26))*Math.PI/180;decay=rnd(.925,.945);v0=reachMax()*power*rnd(.35,1.05)*(1-decay);
      parts.push({k:2,x:ox,y:oy,vx:Math.cos(a)*v0,vy:Math.sin(a)*v0,decay:decay,fall:0,term:rnd(.5,1.1)*S,wob:rnd(0,6.28),wobS:rnd(.2,.4),
        sway:0,rot:0,spin:0,tilt:0,tiltS:0,c:Math.random()<.5?PAL[3]:PAL[1],sz:rnd(.8,1.5)*S,life:0,max:Math.floor(rnd(100,170))});
    }
  }
  function blast(power,nF,nS){emit(-1,nF,nS,power);emit(1,nF,nS,power);kick()}
  function bigBlast(){blast(1,small?70:150,small?25:60)}
  function followUp(p){blast(p,small?20:45,small?10:20)}

  function step(){
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.vx*=p.decay;p.vy*=p.decay;p.fall+=(p.term-p.fall)*.035;p.wob+=p.wobS;p.life++;
      var sw=Math.min(1,p.life/40)*p.sway;
      p.x+=p.vx+Math.cos(p.wob)*sw;p.y+=p.vy+p.fall;p.rot+=p.spin;p.tilt+=p.tiltS;
      if(p.y>H+40||p.x<-80||p.x>W+80||p.life>p.max||p.life>1100)parts.splice(i,1);
    }
  }
  function star(x,y,r,al){
    ctx.globalAlpha=al;ctx.strokeStyle='#FFFFFF';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.moveTo(x,y-r);ctx.lineTo(x,y+r);ctx.stroke();
    ctx.globalAlpha=1;
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<parts.length;i++){
      var p=parts[i],z=p.sz,fade=p.life>850?Math.max(0,1-(p.life-850)/250):1;
      if(p.k===2){
        var tw=.55+.45*Math.sin(p.wob),al=Math.min(1,(p.max-p.life)/30)*tw;
        if(al<=0)continue;
        ctx.globalAlpha=al;
        var sp=Math.abs(p.vx)+Math.abs(p.vy);
        if(sp>2){ctx.strokeStyle='rgba('+p.c[0]+','+p.c[1]+','+p.c[2]+',.55)';ctx.lineWidth=1.2*z;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*3,p.y-p.vy*3);ctx.stroke()}
        ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(p.x,p.y,1.4*z,0,6.2832);ctx.fill();
        ctx.globalAlpha=1;
        if(tw>.97)star(p.x,p.y,5*z,al*.9);
        continue;
      }
      var cs=Math.cos(p.tilt),b=.42+.58*Math.abs(cs);
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,cs);ctx.globalAlpha=fade;
      ctx.fillStyle='rgb('+(p.c[0]*b|0)+','+(p.c[1]*b|0)+','+(p.c[2]*b|0)+')';
      if(p.k===0)ctx.fillRect(-5.5*z,-3.5*z,11*z,7*z);else ctx.fillRect(-9*z,-1.5*z,18*z,3*z);
      if(Math.abs(cs)>.975){ctx.fillStyle='rgba(255,255,255,.85)';if(p.k===0)ctx.fillRect(-5.5*z,-3.5*z,11*z,7*z);else ctx.fillRect(-9*z,-1.5*z,18*z,3*z)}
      ctx.restore();
      if(Math.abs(cs)>.993)star(p.x,p.y,7*z,.85*fade);
    }
  }
  function loop(t){
    if(!running)return;
    if(!last)last=t;
    var dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;
    var k=0;while(acc>=1/60&&k<4){step();acc-=1/60;k++}
    if(k===4)acc=0;
    draw();
    if(!parts.length){running=false;ctx.clearRect(0,0,W,H);return}
    requestAnimationFrame(loop);
  }
  function kick(){if(!running){running=true;last=0;acc=0;requestAnimationFrame(loop)}}
  function stopFx(){running=false;parts=[];ctx.clearRect(0,0,W,H)}
  function sprinkle(){
    ctx.clearRect(0,0,W,H);
    var seed=11;function r(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
    for(var i=0;i<40;i++){
      var side=i%2?1:-1,x=side<0?r()*W*.28:W-r()*W*.28,y=H-r()*H*.45,c=PAL[Math.floor(r()*5)],b=.5+r()*.5,z=S*(.9+r()*.4);
      ctx.save();ctx.translate(x,y);ctx.rotate(r()*6.28);ctx.fillStyle='rgb('+(c[0]*b|0)+','+(c[1]*b|0)+','+(c[2]*b|0)+')';
      ctx.fillRect(-5.5*z,-3.5*z,11*z,7*z);ctx.restore();
      if(i%6===0)star(x+12*z,y-10*z,6*z,.8);
    }
  }

  /* ---------- spotlights ---------- */
  var spotMode='A';
  function ang(fx,tx,ty){var ox=fx*W,oy=-.06*H;return -Math.atan2(tx-ox,ty-oy)*180/Math.PI}
  function setSpots(m){
    var a,b;
    if(m==='aim'){a=ang(.14,W*.5,H*.86);b=ang(.86,W*.5,H*.86)}
    else if(m==='A'){a=ang(.14,W*.27,H);b=ang(.86,W*.6,H)}
    else{a=ang(.14,W*.42,H);b=ang(.86,W*.74,H)}
    spL.style.setProperty('--a',a.toFixed(2)+'deg');spR.style.setProperty('--a',b.toFixed(2)+'deg');spotMode=m;
  }
  setSpots('A');

  /* ---------- sound ---------- */
  var actx=null,master=null,soundOn=false,nbuf=null;
  function ensureAudio(){
    try{
      if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;actx=new AC();master=actx.createGain();master.gain.value=.38;master.connect(actx.destination);
        nbuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);var d=nbuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}
      if(actx.state==='suspended')actx.resume();
    }catch(e){actx=null}
    return actx;
  }
  function dest(pan){if(pan&&actx.createStereoPanner){var p=actx.createStereoPanner();p.pan.value=pan;p.connect(master);return p}return master}
  function noise(t,dur,type,freq,vol,pan,q){
    var n=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
    n.buffer=nbuf;f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(f);f.connect(g);g.connect(dest(pan));n.start(t);n.stop(t+dur+.02);
  }
  function tone(t,f0,f1,dur,vol,type){
    var o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);
    if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
  }
  function sfx(name,arg){
    if(!soundOn||!actx)return;
    try{
      var t=actx.currentTime;
      if(name==='shutter'){var v=arg||1;noise(t,.03,'highpass',3200,.5*v);noise(t+.065,.04,'highpass',2400,.42*v)}
      else if(name==='thump'){tone(t,95,38,.6,.45)}
      else if(name==='blast'){noise(t,.35,'lowpass',900,.5,-.7);noise(t,.35,'lowpass',900,.5,.7);
        [2093,2637,3136,2349,2794,3520].forEach(function(f,i){tone(t+.12+i*.07,f,0,.5,.045,'sine')})}
      else if(name==='shimmer'){[1568,2093,2637].forEach(function(f,i){tone(t+i*.06,f,0,.7,.05,'triangle')})}
      else if(name==='cut'){noise(t,.25,'lowpass',260,.55);tone(t,70,35,.35,.4)}
    }catch(e){}
  }
  function setSound(on){soundOn=on;sndBtn.setAttribute('aria-pressed',String(on));sndBtn.textContent=on?'Sound on':'Sound off'}
  sndBtn.addEventListener('click',function(){
    var on=!soundOn;if(on&&!ensureAudio())on=false;setSound(on);
  });

  /* ---------- sequence ---------- */
  var FINAL=['go','lit','aim','walk-on','nm','hbon','rdy','ctaon'];
  var T=[];
  function at(ms,fn){T.push(setTimeout(fn,ms))}
  function add(c){stage.classList.add(c)}
  function clearT(){T.forEach(clearTimeout);T=[]}
  function restart(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
  function strobe(n){
    num.textContent=n;
    Array.prototype.forEach.call(count.querySelectorAll('.dots span'),function(s){s.classList.toggle('on',s.getAttribute('data-n')===String(n))});
    restart(count,'tick');restart(flashEl,'on');sfx('shutter');
  }
  function camFlash(){
    var d=document.createElement('div');d.className='cam';
    var s=Math.round(rnd(60,150)*S);d.style.setProperty('--s',s+'px');
    var left=Math.random()<.5;
    d.style.left=(left?rnd(4,34):rnd(66,96))+'%';d.style.top=rnd(48,92)+'%';
    d.addEventListener('animationend',function(){d.remove()});
    cams.appendChild(d);
    if(Math.random()<.4)sfx('shutter',.35);
  }
  function reset(){
    clearT();stopFx();cams.innerHTML='';
    stage.classList.remove.apply(stage.classList,FINAL.concat(['counting','skip','rm','cut']));
    count.classList.remove('tick');flashEl.classList.remove('on');
    void stage.offsetWidth;
  }
  function start(){
    reset();
    endEl.hidden=true;endEl.classList.remove('show');ctrls.hidden=false;skpBtn.hidden=false;
    gate.hidden=false;
    add('go');add('lit');setSpots('B');sfx('thump');
    at(650,function(){gate.hidden=true});
    at(450,function(){add('counting');strobe(3)});
    at(1350,function(){strobe(2);setSpots('A')});
    at(2250,function(){strobe(1);setSpots('aim');add('aim');add('walk-on');sfx('thump')});
    at(2500,function(){add('nm')});
    at(2700,function(){bigBlast();restart(cfl,'on');restart(cfr,'on');sfx('blast')});
    for(var i=0;i<13;i++)at(2600+i*rnd(170,230),camFlash);
    at(3150,function(){add('hbon');stage.classList.remove('counting')});
    at(3500,function(){followUp(.65)});
    at(3900,function(){add('rdy')});
    at(4300,function(){followUp(.5);add('ctaon');skpBtn.hidden=true;sfx('shimmer')});
  }
  function showFinal(){
    gate.hidden=true;setSpots('aim');
    stage.classList.add.apply(stage.classList,FINAL);
    stage.classList.remove('counting');skpBtn.hidden=true;
  }
  function skip(){
    clearT();
    var blasted=stage.classList.contains('aim');
    add('skip');showFinal();
    if(!blasted){bigBlast();sfx('blast')}
    cta.focus({preventScroll:true});
  }
  function initReduced(){
    reset();add('rm');showFinal();sprinkle();
    endEl.hidden=true;endEl.classList.remove('show');ctrls.hidden=false;
  }
  function replay(){if(reduced)initReduced();else start()}

  lights.addEventListener('click',function(){
    if(ensureAudio())setSound(true);
    start();
  });
  skpBtn.addEventListener('click',skip);
  repBtn.addEventListener('click',replay);
  again.addEventListener('click',replay);
  cta.addEventListener('click',function(){
    clearT();add('cut');sfx('cut');
    T.push(setTimeout(function(){
      stopFx();cams.innerHTML='';ctrls.hidden=true;
      endEl.hidden=false;void endEl.offsetWidth;endEl.classList.add('show');
      again.focus({preventScroll:true});
    },reduced?200:650));
  });

  window.addEventListener('resize',function(){
    size();setSpots(spotMode);
    if(reduced){if(stage.classList.contains('rm'))sprinkle();return}
    if(parts.length){draw();kick()}
  });

  if(reduced)initReduced();
})();
</script>
