<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Chaithrika Birthday 06 Gift Box Unwrap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bw:min(250px,54vw,30vh);--bh:calc(var(--bw) * .74);--lh:calc(var(--bw) * .2);--top:clamp(250px,37vh,340px)}
html,body{margin:0;height:100%;overflow:hidden;background:#2A0F1F;color:#F6E3C8}
body{font-family:'Josefin Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid #F3C98B;outline-offset:4px}

/* stand-in site */
#site{position:fixed;inset:0;z-index:0;display:grid;place-items:center;padding:24px 20px;text-align:center;background:radial-gradient(100% 80% at 50% 40%,#FFFBF2,#FBF0DD 60%,#F3E0C2);color:#3A1022}
#site .box{max-width:540px}
#site .eyebrow{margin:0 0 12px;font-size:12px;letter-spacing:.38em;text-transform:uppercase;color:#9C5A43;padding-left:.38em}
#site h2{margin:0 0 10px;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(30px,5.4vw,46px);line-height:1.1;color:#3A1022}
#site p.note{margin:0 0 28px;font-weight:300;font-size:16px;line-height:1.5;color:#6B3A40}
.ghost{background:#3A1022;color:#FBF0DD;border:0;border-radius:999px;padding:13px 24px;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.ghost:hover{background:#5A1C35}
.ghost:focus-visible{outline-color:#9C5A43}

/* stage */
#stage{position:fixed;inset:0;z-index:2;overflow:hidden;opacity:0;transition:opacity .9s ease;
  background:radial-gradient(90% 60% at 50% 100%,rgba(122,32,62,.55),rgba(122,32,62,0) 70%),radial-gradient(120% 85% at 50% 32%,#4A1A33 0%,#2A0F1F 58%,#1C0914 100%)}
#stage.on{opacity:1}
#stage.noanim,#stage.noanim *{transition:none!important;animation:none!important}
.sky{position:absolute;inset:0}
.sky i{position:absolute;display:block;border-radius:50%;background:#FFF1D6;box-shadow:0 0 6px rgba(255,226,180,.8);animation:tw var(--d) ease-in-out var(--dl) infinite;opacity:.25}
@keyframes tw{0%,100%{opacity:.18;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}

.ctrl{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:flex-end;gap:8px;z-index:9;flex-wrap:wrap}
.chip{background:rgba(255,240,220,.08);color:#F6E3C8;border:1px solid rgba(246,227,200,.24);border-radius:999px;padding:7px 13px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.chip:hover{border-color:#F3C98B;color:#FFF3DE}
.chip[aria-pressed="true"]{background:rgba(243,201,139,.18);border-color:rgba(243,201,139,.6)}
.link{background:none;border:0;color:#E9C9A0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;padding:7px 6px}
.link:hover{color:#FFF3DE}

/* gift */
.gift{position:absolute;left:50%;top:calc(50% - var(--bw) * .1);width:var(--bw);height:var(--bh);transform:translateX(-50%);z-index:3;transition:top 1.25s cubic-bezier(.6,0,.2,1)}
.opened .gift{top:calc(95% - var(--bh))}
.floor{position:absolute;left:-30%;right:-30%;bottom:-14%;height:26%;border-radius:50%;background:radial-gradient(closest-side,rgba(10,2,8,.55),rgba(10,2,8,0))}
.wob{position:absolute;inset:0;transform-origin:50% 100%;animation:wob 4s ease-in-out 1.4s infinite}
@keyframes wob{0%,66%,100%{transform:none}70%{transform:rotate(-4deg) translateY(-3px)}75%{transform:rotate(3.5deg) translateY(-2px)}80%{transform:rotate(-2.4deg)}85%{transform:rotate(1.4deg)}90%{transform:rotate(-.5deg)}}
.opening .wob{animation:none}

.front{position:absolute;inset:0;z-index:2;border-radius:3px 3px 8px 8px;overflow:hidden;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55) 0 1.6px,transparent 2.2px) 0 0/20px 20px,
             radial-gradient(circle at 80% 80%,rgba(192,72,108,.35) 0 1.4px,transparent 2px) 0 0/20px 20px,
             linear-gradient(160deg,#FBD2DB 0%,#F2A9BA 52%,#DE8299 100%);
  box-shadow:inset -22px 0 34px rgba(110,24,56,.28),inset 0 -14px 24px rgba(110,24,56,.22),0 18px 40px rgba(8,0,6,.45)}
.frib{position:absolute;left:42%;width:16%;top:0;bottom:0;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.6,0,.4,1) .15s;
  background:linear-gradient(90deg,#9E5A47,#E9B89C 28%,#FBE0CD 46%,#E2A487 64%,#A8624D)}
.rim{position:absolute;left:0;right:0;top:0;height:9%;opacity:0;transition:opacity .4s;background:linear-gradient(180deg,#3A0E22,#7A2E48);box-shadow:0 2px 6px rgba(255,220,170,.4)}
.lidoff .rim{opacity:1}

.lid{position:absolute;z-index:3;bottom:100%;left:-5%;width:110%;height:var(--lh);border-radius:5px;margin-bottom:-2px;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55) 0 1.6px,transparent 2.2px) 0 0/20px 20px,linear-gradient(170deg,#FCD9E1,#F0A3B6 70%,#D97A93);
  box-shadow:inset 0 -6px 10px rgba(110,24,56,.25),0 8px 12px rgba(60,6,30,.35)}
.lrib{position:absolute;left:42.7%;width:14.6%;top:0;bottom:0;background:linear-gradient(90deg,#9E5A47,#E9B89C 28%,#FBE0CD 46%,#E2A487 64%,#A8624D)}
.lidoff .lid{animation:lidAway 1.25s cubic-bezier(.25,.6,.35,1) forwards}
@keyframes lidAway{0%{transform:none}16%{transform:translateY(-35%) rotate(-5deg)}100%{transform:translate(42vw,-88vh) rotate(420deg);opacity:0}}

.bow{position:absolute;left:50%;bottom:86%;width:calc(var(--bw) * .64);height:calc(var(--bw) * .36);transform:translateX(-50%)}
.loop{position:absolute;bottom:14%;width:48%;height:84%;border-radius:50%;transition:transform .6s cubic-bezier(.5,0,.6,1),opacity .5s ease .1s;
  background:radial-gradient(ellipse 34% 26% at 50% 54%,#7E3A33 0 55%,transparent 62%),linear-gradient(160deg,#FBE0CD,#E2A487 45%,#A8624D);
  box-shadow:inset -4px -4px 8px rgba(80,30,20,.35),0 4px 8px rgba(40,4,20,.3)}
.loop.l{left:2%;transform-origin:95% 85%;transform:rotate(-16deg)}
.loop.r{right:2%;transform-origin:5% 85%;transform:rotate(16deg)}
.knot{position:absolute;left:50%;bottom:6%;width:22%;aspect-ratio:1;border-radius:46%;transform:translateX(-50%);z-index:2;transition:transform .45s ease .2s,opacity .4s ease .2s;
  background:radial-gradient(circle at 40% 35%,#FDE8D9,#E2A487 50%,#9E5A47);box-shadow:0 3px 6px rgba(40,4,20,.35)}
.tail{position:absolute;top:66%;width:13%;height:80%;transition:transform 1.05s cubic-bezier(.55,0,.85,.4),opacity .9s ease .2s;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);background:linear-gradient(90deg,#A8624D,#F1C6AD 45%,#C98466)}
.tail.l{left:36%;transform-origin:50% 0;transform:rotate(22deg)}
.tail.r{right:36%;transform-origin:50% 0;transform:rotate(-22deg)}
.untie .loop.l{transform:rotate(-70deg) scale(.12) translateY(30%);opacity:0}
.untie .loop.r{transform:rotate(70deg) scale(.12) translateY(30%);opacity:0}
.untie .knot{transform:translateX(-50%) scale(0);opacity:0}
.untie .tail.l{transform:translate(-20px,70vh) rotate(110deg);opacity:0}
.untie .tail.r{transform:translate(24px,70vh) rotate(-120deg);opacity:0}
.untie .frib{transform:scaleY(0)}

.beams{position:absolute;left:50%;bottom:91%;width:calc(var(--bw) * 3.4);height:88vh;z-index:0;pointer-events:none;transform-origin:50% 100%;transform:translateX(-50%) scaleY(0);opacity:0;transition:transform 1.1s cubic-bezier(.2,.8,.2,1),opacity .8s ease;
  background:repeating-conic-gradient(from -64deg at 50% 100%,rgba(255,226,170,0) 0deg,rgba(255,226,170,.42) 4deg,rgba(255,226,170,0) 9deg,rgba(255,226,170,0) 13deg);
  -webkit-mask-image:radial-gradient(ellipse 52% 100% at 50% 100%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 52% 100% at 50% 100%,#000 25%,transparent 78%)}
.beams::before{content:"";position:absolute;inset:30% 20% 0;background:radial-gradient(ellipse 50% 70% at 50% 100%,rgba(255,232,186,.75),rgba(255,200,150,0) 70%)}
.glow .beams{opacity:1;transform:translateX(-50%) scaleY(1);animation:beam 3.2s ease-in-out 1.2s infinite}
@keyframes beam{0%,100%{opacity:1}50%{opacity:.72}}

.rise{position:absolute;left:50%;bottom:50%;z-index:1;width:calc(var(--bw) * 2.6);height:calc(95vh - var(--bh) * .5 - var(--top));transform:translateX(-50%);overflow:hidden;pointer-events:none}
@supports (height:1dvh){.rise{height:calc(95dvh - var(--bh) * .5 - var(--top))}}
.rise img{position:absolute;left:50%;bottom:0;height:100%;width:auto;transform:translate(-50%,100%);filter:drop-shadow(0 0 22px rgba(255,214,150,.55)) drop-shadow(0 0 2px rgba(255,240,210,.9));transition:transform 1.9s cubic-bezier(.2,.8,.2,1)}
.risen .rise img{transform:translate(-50%,0)}

.for,.tap{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;margin:0;transition:opacity .5s ease,transform .5s ease}
.for{bottom:calc(100% + var(--lh) + var(--bw) * .36 + 18px);font-size:12px;font-weight:400;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:#E9C9A0}
.tap{top:calc(100% + clamp(22px,4vh,40px));font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(23px,3vw,32px);color:#F6E3C8;animation:hint 2.8s ease-in-out infinite}
@keyframes hint{0%,100%{opacity:.75}50%{opacity:1}}
.tap::after{content:"";display:block;width:44px;height:1px;margin:10px auto 0;background:linear-gradient(90deg,rgba(243,201,139,0),#F3C98B,rgba(243,201,139,0))}
.opening .for,.opening .tap{opacity:0;animation:none;transform:translate(-50%,8px)}
.openbtn{position:absolute;z-index:6;left:-24%;right:-24%;top:calc(-1 * (var(--lh) + var(--bw) * .36 + 52px));bottom:calc(-1 * clamp(80px,12vh,110px));background:transparent;border:0;border-radius:28px;padding:0}
.openbtn:focus-visible{outline:2px solid #F3C98B;outline-offset:2px}

.cta{position:absolute;z-index:7;left:50%;top:52%;transform:translate(-50%,-50%);white-space:nowrap;border:0;border-radius:999px;padding:15px 26px;
  font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#3A1022;background:linear-gradient(180deg,#FFF0D6,#EFC27E 60%,#DFA45E);
  box-shadow:0 0 0 1px rgba(255,240,214,.6),0 10px 30px rgba(255,190,110,.35),0 0 50px rgba(255,214,150,.3);animation:ctaIn .8s cubic-bezier(.34,1.5,.64,1) both;transition:box-shadow .25s,filter .25s}
.cta:hover{filter:brightness(1.06);box-shadow:0 0 0 1px rgba(255,240,214,.9),0 14px 36px rgba(255,190,110,.45),0 0 70px rgba(255,214,150,.45)}
.cta span{display:inline-block;transition:transform .2s}.cta:hover span{transform:translateX(4px)}
.cta:focus-visible{outline-color:#FFF3DE}
@keyframes ctaIn{from{opacity:0;transform:translate(-50%,-30%) scale(.88)}to{opacity:1;transform:translate(-50%,-50%)}}

/* greeting */
.greet{position:absolute;z-index:4;left:16px;right:16px;top:52px;height:calc(var(--top) - 52px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.hb{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(24px,4.2vw,44px);line-height:1.1;color:#F3D9B1;clip-path:inset(-30% 100% -30% 0);transition:clip-path 1s cubic-bezier(.6,0,.3,1)}
.name{position:relative;display:inline-block;margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(58px,12vw,132px);line-height:.98;white-space:nowrap}
.ink{display:inline-block;padding:0 .08em .06em;color:#F3D2A2;clip-path:inset(-30% 100% -30% 0);transition:clip-path 1.6s cubic-bezier(.55,0,.35,1) .45s}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .ink{background:linear-gradient(100deg,#F9E7C6 8%,#E7B36B 32%,#F7CFCB 55%,#E7B36B 78%,#F9E7C6 96%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
  .greet-on .ink{animation:sheen 5s linear 2.2s infinite}
}
@keyframes sheen{to{background-position:-200% 0}}
.name::after{content:"";position:absolute;top:52%;left:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;opacity:0;background:radial-gradient(circle,#FFFFFF,rgba(255,226,170,0) 70%);box-shadow:0 0 16px 6px rgba(255,214,150,.55)}
.greet-on .name::after{animation:pen 1.6s cubic-bezier(.55,0,.35,1) .45s both}
@keyframes pen{0%{left:0;opacity:0}8%{opacity:1}88%{opacity:1}100%{left:100%;opacity:0}}
.sub{margin:clamp(8px,1.6vh,16px) 0 0;font-size:clamp(11px,1.2vw,13px);letter-spacing:.34em;padding-left:.34em;text-transform:uppercase;color:#E9C9A0;opacity:0;transition:opacity 1s ease 1.8s}
.greet-on .hb,.greet-on .ink{clip-path:inset(-30% -6% -30% -6%)}
.greet-on .sub{opacity:1}
.final .hb,.final .ink{transition-delay:0s}
.final .sub{transition-delay:.3s}
.final .lid{animation:none;opacity:0;visibility:hidden}
.final .name::after{animation:none}

/* reduced motion */
.sprinkle{position:absolute;inset:0;display:none;z-index:1}
.calm .sprinkle{display:block}
.calm .sky i{animation:none;opacity:.7}
.calm .lid,.calm .bow,.calm .frib{visibility:hidden}
.calm .hb,.calm .ink{clip-path:none!important;opacity:0;animation:fadeOnly 1.4s ease .2s both!important;transition:none}
.calm .name::after{display:none}
.calm .cta{animation:fadeOnly 1.4s ease .4s both}
.calm .gift,.calm .rise img,.calm .beams{transition:none!important}
.calm .beams{animation:none}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
.sprinkle i{position:absolute;display:block;border-radius:2px}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
.flood{position:fixed;inset:0;z-index:8;pointer-events:none;background:radial-gradient(circle at 50% 74%,#FFFFFF 0%,#FFF6E2 30%,#F8E3B8 62%,#EBC889 100%);clip-path:circle(0% at 50% 74%);transition:clip-path 1.05s cubic-bezier(.6,0,.3,1),opacity 1s ease}
.flood.on{clip-path:circle(150% at 50% 74%)}
.flood.on.out{opacity:0}
.flood.soft{clip-path:none;opacity:0}
.flood.soft.on{opacity:1}
.flood.soft.on.out{opacity:0}
.flood.noanim{transition:none}
@media (max-height:560px){:root{--top:clamp(180px,40vh,250px)}.greet{top:44px;height:calc(var(--top) - 44px)}}
</style>

<div id="site" hidden>
  <div class="box">
    <p class="eyebrow">With love</p>
    <h2>Your website opens here</h2>
    <p class="note">The homepage (Glass Portals) would load now.</p>
    <button class="ghost" id="again" type="button">Replay the opening</button>
  </div>
</div>

<div id="stage" class="noanim">
  <div class="sky" id="sky" aria-hidden="true"></div>
  <div class="sprinkle" id="sprinkle" aria-hidden="true"></div>

  <div class="ctrl">
    <button class="chip" id="sound" type="button" aria-pressed="true">Sound on</button>
    <button class="chip" id="replay" type="button">Replay</button>
    <button class="link" id="skip" type="button">Skip</button>
  </div>

  <header class="greet">
    <p class="hb">Happy Birthday,</p>
    <h1 class="name"><span class="ink">Chaithrika</span></h1>
    <p class="sub">A little gift, made just for you</p>
  </header>

  <div class="gift" id="gift">
    <div class="floor" aria-hidden="true"></div>
    <div class="wob">
      <div class="beams" aria-hidden="true"></div>
      <div class="rise"><img src="/images/designs/runway-cutout.png" alt="Chaithrika walking the runway"></div>
      <div class="front" aria-hidden="true"><i class="rim"></i><i class="frib"></i></div>
      <div class="lid" aria-hidden="true"><i class="lrib"></i>
        <div class="bow"><i class="tail l"></i><i class="tail r"></i><i class="loop l"></i><i class="loop r"></i><i class="knot"></i></div>
      </div>
    </div>
    <p class="for">For Chaithrika</p>
    <p class="tap">Tap to open your gift</p>
    <button class="openbtn" id="openBtn" type="button" aria-label="Open your gift"></button>
    <button class="cta" id="cta" type="button" hidden>Enter your website <span aria-hidden="true">&rarr;</span></button>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="flood" id="flood" aria-hidden="true"></div>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var stage = $('#stage'), site = $('#site'), cta = $('#cta'), skipB = $('#skip'), replayB = $('#replay'), soundB = $('#sound'), again = $('#again'), openBtn = $('#openBtn'), flood = $('#flood');
  var RM = window.matchMedia('(prefers-reduced-motion: reduce)');
  var PAL = [['#E7B36B','#B9873F'],['#F2C14E','#C4952B'],['#E8708F','#B54866'],['#F6C8C8','#D99A9F'],['#F7E3BE','#D9BF8E'],['#FFF6E4','#E3D3B4']];
  function rnd(a, b){ return a + Math.random() * (b - a); }

  // stars + reduced-motion sprinkle
  (function(){
    var h = '';
    for (var i = 0; i < 70; i++) {
      var s = rnd(1, 2.8);
      h += '<i style="left:' + rnd(0, 100).toFixed(1) + '%;top:' + rnd(0, 100).toFixed(1) + '%;width:' + s.toFixed(1) + 'px;height:' + s.toFixed(1) + 'px;--d:' + rnd(2.2, 5).toFixed(1) + 's;--dl:-' + rnd(0, 5).toFixed(1) + 's"></i>';
    }
    $('#sky').innerHTML = h;
    var sp = '';
    for (var j = 0; j < 40; j++) {
      var left = j % 2 === 0, x = left ? rnd(1, 30) : rnd(70, 99), y = rnd(45, 98), w = rnd(5, 10), round = Math.random() < .3, c = PAL[j % PAL.length][0];
      sp += '<i style="left:' + x.toFixed(1) + '%;top:' + y.toFixed(1) + '%;width:' + w.toFixed(0) + 'px;height:' + (round ? w : w * 1.7).toFixed(0) + 'px;background:' + c + ';transform:rotate(' + rnd(0, 360).toFixed(0) + 'deg);opacity:.8;' + (round ? 'border-radius:50%' : '') + '"></i>';
    }
    $('#sprinkle').innerHTML = sp;
  })();

  /* ---------- sound ---------- */
  var AC = null, master = null, NB = null, soundOn = true, started = false;
  function ac(){
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      AC = new C(); master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
      NB = AC.createBuffer(1, AC.sampleRate * 0.8 | 0, AC.sampleRate);
      var d = NB.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function env(g, t, peak, dur){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  function pop(vol, delay){
    if (!soundOn || !started) return; var a = ac(); if (!a) return; var t = a.currentTime + (delay || 0);
    var n = a.createBufferSource(); n.buffer = NB; var f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.9;
    f.frequency.setValueAtTime(2000, t); f.frequency.exponentialRampToValueAtTime(360, t + 0.18);
    var g = a.createGain(); env(g, t, vol, 0.26); n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t + 0.3);
    var o = a.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(52, t + 0.17);
    var g2 = a.createGain(); env(g2, t, vol * 0.8, 0.2); o.connect(g2); g2.connect(master); o.start(t); o.stop(t + 0.24);
  }
  function chime(vol){
    if (!soundOn || !started) return; var a = ac(); if (!a) return; var t = a.currentTime;
    [1046.5, 1318.5, 1568, 2093, 2637].forEach(function(fq, i){
      var o = a.createOscillator(); o.type = 'sine'; o.frequency.value = fq * (1 + rnd(-0.002, 0.002));
      var g = a.createGain(); env(g, t + i * 0.09, vol || 0.045, 1.6); o.connect(g); g.connect(master); o.start(t + i * 0.09); o.stop(t + i * 0.09 + 1.7);
    });
  }
  function rustle(vol, up){
    if (!soundOn || !started) return; var a = ac(); if (!a) return; var t = a.currentTime;
    var n = a.createBufferSource(); n.buffer = NB; var f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1;

  /* ---------- particles ---------- */
  var cv = $('#fx'), ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, G = 620, sH = 1, sW = 1, parts = [], raf = 0, last = 0;
  var SPARK = new Path2D(); (function(){ for (var i = 0; i < 8; i++){ var r = i % 2 ? 0.28 : 1, a = -Math.PI / 2 + i * Math.PI / 4; if (i) SPARK.lineTo(Math.cos(a) * r, Math.sin(a) * r); else SPARK.moveTo(Math.cos(a) * r, Math.sin(a) * r); } SPARK.closePath(); })();

      var type = r < 0.56 ? 'rect' : r < 0.70 ? 'circle' : r < 0.86 ? 'streamer' : 'spark';
      var p = { type: type, x: x + rnd(-6, 6), y: y + rnd(-6, 6), vx: dir * Math.cos(a) * sp * sW, vy: -Math.sin(a) * sp * sH,
        k: rnd(1.9, 2.7), g: 1, rot: rnd(0, 6.28), vr: rnd(-8, 8), flip: rnd(0, 6.28), fs: rnd(5, 13), wf: rnd(2, 5), ph: rnd(0, 6.28),

        p.c = ['#E7B36B', '#E8708F', '#F7E3BE', '#F2C14E'][(Math.random() * 4) | 0]; }
      else { p.w = rnd(5, 9) * sz; p.c = Math.random() < .75 ? '#FFE7B0' : '#FFFFFF'; p.c2 = p.c; p.fs = rnd(8, 16); p.k += 0.4; p.life = rnd(3, 5); }

  /* ---------- timeline ---------- */

    at(1950, function(){ add('risen'); });

    at(3900, function(){ fire(0.3, 0.6); });

  }

  }

  stage.addEventListener('click', function(e){ if (state === 'rest' && !e.target.closest('.ctrl')) openGift(); });
  cta.addEventListener('click', exit);
  skipB.addEventListener('click', skip);

  start();
})();
