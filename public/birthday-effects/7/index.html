<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Chaithrika Birthday 07 Petals & Glitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--blush:#FBEFF1;--cream:#FFF9F3;--rose:#E7A3B4;--pink:#F4C6CF;--peach:#F7D9C4;--deep:#D9788F;--ink:#6B3A48;--ink2:#8A5A66}
*{box-sizing:border-box}
html,body{background:#FFF9F3;color:#6B3A48;margin:0;overflow-x:hidden}
body{min-height:100vh;font-family:"Cormorant Garamond",Georgia,serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
:focus-visible{outline:2px solid #B4536E;outline-offset:3px}

.stage{position:fixed;inset:0;overflow:hidden;z-index:1;background:linear-gradient(172deg,#FBEFF1 0%,#FCF3F1 45%,#FFF9F3 100%)}
.mist{position:absolute;inset:-10%;background:radial-gradient(ellipse at 30% 20%,rgba(244,198,207,.45),rgba(244,198,207,0) 55%),radial-gradient(ellipse at 75% 80%,rgba(247,217,196,.5),rgba(247,217,196,0) 55%);animation:mist 18s ease-in-out infinite alternate}
@keyframes mist{to{transform:translate(3%,-2%) scale(1.05)}}
.bk{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75) 0%,rgba(244,198,207,.45) 38%,rgba(244,198,207,0) 70%);filter:blur(1px);animation:bk var(--d,18s) ease-in-out infinite alternate;opacity:.8}
.bk.p{background:radial-gradient(circle,rgba(255,255,255,.7) 0%,rgba(247,217,196,.5) 38%,rgba(247,217,196,0) 70%)}
@keyframes bk{0%{transform:translate(0,0)}100%{transform:translate(var(--x,30px),var(--y,-40px))}}

.wrap{position:absolute;inset:0;display:grid;place-items:center;padding:60px 16px 32px;overflow-y:auto;overflow-x:hidden;z-index:2;transition:opacity .9s ease,filter .9s ease,transform .9s ease}
.stage.leaving .wrap{opacity:0;filter:blur(6px);transform:translateY(-14px)}
.col{text-align:center;width:min(760px,100%);display:flex;flex-direction:column;align-items:center}

.oval{position:relative;width:clamp(124px,19vw,218px);aspect-ratio:4/5;margin-bottom:clamp(6px,1.5vw,14px);opacity:0;transform:scale(1.06);transition:opacity 2.2s ease,transform 3.2s cubic-bezier(.2,.7,.2,1)}
.oval.on{opacity:1;transform:none}
.oval::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(217,120,143,.32)}
.oval::after{content:"";position:absolute;inset:-17px;border-radius:50%;border:1px solid rgba(217,120,143,.14)}
.oval img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:50%;
  filter:saturate(.88) contrast(.9) brightness(1.05);opacity:.9;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,rgba(0,0,0,0) 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,rgba(0,0,0,0) 100%)}

.script{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(2.7rem,9.5vw,5.6rem);line-height:1.15;color:#C25D7A;margin:-.12em 0 -.1em;padding:.12em .4em .1em;
  text-shadow:0 2px 18px rgba(231,163,180,.45);clip-path:inset(0 100% 0 0);transition:clip-path 2s cubic-bezier(.45,.05,.3,1)}
.script.on{clip-path:inset(0 0 0 0)}
.name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;text-transform:uppercase;font-size:clamp(1.85rem,7.2vw,4.5rem);line-height:1.1;margin:.12em 0 0;
  letter-spacing:.5em;margin-right:-.5em;color:#6B3A48;opacity:0;transform:translateY(18px);filter:blur(6px);
  transition:opacity 1.6s ease,transform 1.8s cubic-bezier(.2,.7,.2,1),filter 1.6s ease,letter-spacing 2.2s cubic-bezier(.2,.7,.2,1),margin 2.2s cubic-bezier(.2,.7,.2,1)}
.name.on{opacity:1;transform:none;filter:blur(0);letter-spacing:.3em;margin-right:-.3em}
.rv{opacity:0;transform:translateY(12px);transition:opacity 1.2s ease,transform 1.2s ease}
.rv.on{opacity:1;transform:none}
.sub{font-style:italic;font-weight:400;font-size:clamp(1.08rem,2.3vw,1.38rem);color:#8A5A66;margin:.9em 0 0}
.cta{margin-top:1.7em;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(1.02rem,1.8vw,1.14rem);letter-spacing:.06em;color:#5A2433;
  background:linear-gradient(180deg,#F9DCE2 0%,#F2BFCB 100%);border:1px solid rgba(217,120,143,.5);border-radius:999px;padding:.85em 2.1em;cursor:pointer;
  box-shadow:0 12px 30px -12px rgba(217,120,143,.7),inset 0 1px 0 rgba(255,255,255,.7);visibility:hidden;
  transition:opacity 1.2s ease,transform 1.2s ease,visibility 0s linear 1.2s,box-shadow .35s ease}
.cta.on{visibility:visible;transition:opacity 1.2s ease,transform 1.2s ease,visibility 0s,box-shadow .35s ease}
.cta:hover{box-shadow:0 16px 36px -12px rgba(217,120,143,.85),inset 0 1px 0 rgba(255,255,255,.8)}
.cta .ar{font-family:Georgia,serif;margin-left:.45em}
.sign{font-family:"Great Vibes",cursive;font-size:1.65rem;color:#C77D8F;margin:.9em 0 0}

.ctrl{position:fixed;top:12px;right:12px;z-index:6;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 24px)}
.ctrl button{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#8A5A66;background:rgba(255,249,243,.7);border:1px solid rgba(217,120,143,.3);border-radius:999px;padding:.4em 1em;cursor:pointer;transition:color .3s,border-color .3s}
.ctrl button:hover{color:#5A2433;border-color:#D9788F}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.veil{position:fixed;inset:0;z-index:7;background:#FFF9F3;opacity:0;pointer-events:none;transition:opacity .9s ease}
.veil.on{opacity:1}

.done{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:28px 16px;text-align:center;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 35%,#FBEFF1 0%,#FFF9F3 65%)}
.done .k{font-family:"Great Vibes",cursive;font-size:clamp(1.8rem,5vw,2.4rem);color:#C25D7A;margin:0 0 .2em}
.done h2{font-weight:300;font-size:clamp(1.8rem,5.4vw,3.2rem);letter-spacing:.06em;line-height:1.1;margin:0;color:#6B3A48}
.done p.d{max-width:34rem;margin:.8em auto 0;font-size:clamp(1.05rem,2.2vw,1.25rem);font-style:italic;color:#8A5A66}
.done .cta{visibility:visible;opacity:1;transform:none}
</style>

<div class="stage" id="stage">
  <div class="mist"></div>
  <span class="bk" style="width:180px;height:180px;left:6%;top:12%;--d:19s;--x:40px;--y:-30px"></span>
  <span class="bk p" style="width:110px;height:110px;left:78%;top:8%;--d:16s;--x:-30px;--y:40px"></span>
  <span class="bk" style="width:240px;height:240px;left:70%;top:58%;--d:22s;--x:-50px;--y:-40px"></span>
  <span class="bk p" style="width:90px;height:90px;left:18%;top:66%;--d:15s;--x:30px;--y:-50px"></span>
  <span class="bk" style="width:70px;height:70px;left:45%;top:6%;--d:17s;--x:-20px;--y:30px"></span>
  <span class="bk p" style="width:150px;height:150px;left:-4%;top:44%;--d:21s;--x:50px;--y:20px"></span>
  <span class="bk" style="width:60px;height:60px;left:88%;top:36%;--d:14s;--x:-30px;--y:-30px"></span>
  <span class="bk p" style="width:130px;height:130px;left:38%;top:78%;--d:20s;--x:40px;--y:-30px"></span>
  <div class="wrap">
    <section class="col" aria-label="Birthday greeting">
      <div class="oval" id="oval"><img src="/images/designs/white-chair.jpg" alt="Chaithrika in a white tulle dress"></div>
      <p class="script" id="scr">Happy Birthday</p>
      <h1 class="name" id="nm">Chaithrika</h1>
      <p class="sub rv" id="sub">A little gift, made just for you</p>
      <button class="cta rv" id="cta" type="button">Enter your website<span class="ar" aria-hidden="true">&rarr;</span></button>
      <p class="sign rv" id="sign">With love</p>
    </section>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="ctrl" id="ctrl">
  <button type="button" id="skip">Skip</button>
  <button type="button" id="replay">Replay</button>
  <button type="button" id="snd" aria-pressed="false">Sound off</button>
</div>

<section class="done" id="done" hidden aria-live="polite">
  <div>
    <p class="k">Your portfolio is ready</p>
    <h2>Your website opens here</h2>
    <p class="d">The homepage (Glass Portals) would load now.</p>
    <button class="cta" id="again" type="button">Replay the opening</button>
  </div>
</section>

<div class="veil" id="veil" aria-hidden="true"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var stage=$('#stage'),cv=$('#fx'),ctx=cv.getContext('2d'),done=$('#done'),ctrl=$('#ctrl'),veil=$('#veil');
var E={oval:$('#oval'),scr:$('#scr'),name:$('#nm'),sub:$('#sub'),cta:$('#cta'),sign:$('#sign')};
var skipB=$('#skip'),replayB=$('#replay'),sndB=$('#snd'),againB=$('#again');
var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,DPR=1,P=[],REST=[],raf=0,last=0,rainT=0,rainAcc=0,timers=[],state='intro',swirl=false,soundOn=false,actx=null,nbuf=null;
function R(a,b){return a+Math.random()*(b-a);}
function phone(){return W<700;}
/* petal colour pairs: base, light tip */
var PET=[['#E7A3B4','#F9D9E1'],['#F4C6CF','#FDEBEF'],['#F7D9C4','#FFF1E6'],['#D9788F','#F0AFBF'],['#E7A3B4','#FBE3E8']];
var GH=[340,352,18,40,165];

function size(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  if(reduced&&state==='intro')drawStatic();else if(!raf)drawRest();
}

/* ---------- particles ---------- */
function petal(x,y,vx,vy,o){
  var sc=phone()?.85:1,pc=PET[(Math.random()*PET.length)|0];
  var p={k:0,x:x,y:y,vx:vx,vy:vy,dr:R(1.7,2.3),g:H*.28,rot:R(0,6.283),vr:R(-1.6,1.6),fl:R(0,6.283),vf:R(2,5),
    w:R(10,18)*sc,h:R(13,22)*sc,c:pc,ph:R(0,6.283),sw:R(30,80)*(H/800),sf:R(1,2.2),age:0,max:R(10,14),settle:Math.random()<.32,ry:R(2,12)};
  if(o)for(var k in o)p[k]=o[k];
  P.push(p);return p;
}
function glit(x,y,vx,vy){
  P.push({k:2,x:x,y:y,vx:vx,vy:vy,dr:R(2.2,3),g:H*.2,hu:GH[(Math.random()*GH.length)|0],ph:R(0,6.283),tw:R(3,8),sz:R(.9,2.3),sw:R(10,30),sf:R(1,3),age:0,max:R(5,7.5)});
}
function blast(side,np,ng,power){
  var dir=side?-1:1,ox=side?W+8:-8,oy=H+8,hs=Math.max(.4,Math.min(1.3,W/H*.8)),i,a,v;
  for(i=0;i<np;i++){a=R(12,60)*Math.PI/180;v=H*R(1.0,1.75)*power;petal(ox+R(-6,6),oy+R(0,8),dir*Math.sin(a)*v*hs,-Math.cos(a)*v);}
  for(i=0;i<ng;i++){a=R(8,62)*Math.PI/180;v=H*R(1.2,2.1)*power;glit(ox+R(-4,4),oy,dir*Math.sin(a)*v*hs,-Math.cos(a)*v);}
}
function rain(){petal(R(0,W),-20,R(-10,10),R(20,50)*(H/800),{settle:Math.random()<.2});}

function petalPath(w,h){
  ctx.beginPath();ctx.moveTo(0,h*.5);
  ctx.bezierCurveTo(w*.62,h*.24,w*.58,-h*.5,w*.12,-h*.48);
  ctx.quadraticCurveTo(0,-h*.36,-w*.12,-h*.48);
  ctx.bezierCurveTo(-w*.58,-h*.5,-w*.62,h*.24,0,h*.5);ctx.closePath();
}
function drawPetal(x,y,rot,sx,w,h,c,alpha){
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(rot);
  var back=sx<0;ctx.scale(Math.max(.08,Math.abs(sx)),1);
  var g=ctx.createLinearGradient(0,h*.5,0,-h*.5);
  if(back){g.addColorStop(0,c[1]);g.addColorStop(1,c[0]);}else{g.addColorStop(0,c[0]);g.addColorStop(.85,c[1]);}
  petalPath(w,h);ctx.fillStyle=g;ctx.fill();
  if(!back){ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(0,h*.42);ctx.quadraticCurveTo(w*.06,0,0,-h*.3);ctx.stroke();}
  else{ctx.strokeStyle='rgba(185,90,115,.18)';ctx.lineWidth=.6;petalPath(w,h);ctx.stroke();}
  ctx.restore();
}
function drawRest(){for(var i=0;i<REST.length;i++){var r=REST[i];drawPetal(r.x,H-r.dy,r.rot,r.sx,r.w,r.h,r.c,.95);}}

function loop(now){
  var dt=(now-last)/1000;last=now;if(!(dt>0)||dt>.05)dt=.016;
  ctx.clearRect(0,0,W,H);
  if(rainT>0){rainT-=dt;rainAcc+=dt*(phone()?2.5:5);while(rainAcc>=1){rainAcc-=1;rain();}}
  var cx=W/2,cy=H*.55,cap=phone()?40:75,i,p,e;
  for(i=P.length-1;i>=0;i--){
    p=P[i];p.age+=dt;
    if(p.sw2){ /* exit swirl */
      var dx=p.x-cx,dy=p.y-cy;
      p.vx+=(-dy*1.6-dx*.35)*dt;p.vy+=(dx*1.6-dy*.2-H*1.1)*dt;
      e=Math.exp(-1.1*dt);p.vx*=e;p.vy*=e;p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.k===0){p.rot+=p.vr*2*dt;p.fl+=p.vf*1.6*dt;}
      if(p.y<-60||p.x<-120||p.x>W+120||p.age>p.max){P[i]=P[P.length-1];P.pop();}
      continue;
    }
    e=Math.exp(-p.dr*dt);p.vx*=e;p.vy=p.vy*e+p.g*dt;
    p.x+=(p.vx+Math.sin(p.age*p.sf+p.ph)*p.sw)*dt;p.y+=p.vy*dt;
    if(p.k===0){
      p.rot+=p.vr*dt;p.fl+=p.vf*dt;
      if(p.settle&&p.vy>0&&p.age>.6&&p.y>=H-p.ry&&REST.length<cap){
        REST.push({x:p.x,dy:p.ry,rot:p.rot,sx:.35+.65*Math.abs(Math.sin(p.fl)),w:p.w,h:p.h,c:p.c});
        P[i]=P[P.length-1];P.pop();continue;
      }
    }
    if(p.y>H+30||p.age>p.max||p.x<-90||p.x>W+90){P[i]=P[P.length-1];P.pop();}
  }
  drawRest();
  for(i=0;i<P.length;i++){
    p=P[i];var fade=Math.min(1,(p.max-p.age)/.8);
    if(p.k===0)drawPetal(p.x,p.y,p.rot,Math.sin(p.fl),p.w,p.h,p.c,fade);
    else{
      var tw=Math.abs(Math.sin(p.age*p.tw+p.ph)),h=p.hu+Math.sin(p.age*1.6+p.ph)*38;
      ctx.globalAlpha=Math.max(0,(.35+.65*tw)*fade);
      ctx.fillStyle='hsl('+h.toFixed(0)+',72%,'+(62+tw*14).toFixed(0)+'%)';
      if(tw>.82){var L=p.sz*2.4;ctx.fillRect(p.x-L,p.y-.4,L*2,.8);ctx.fillRect(p.x-.4,p.y-L,.8,L*2);}
      ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
      ctx.globalAlpha=1;
    }
  }
  if(P.length||rainT>0)raf=requestAnimationFrame(loop);
  else{raf=0;ctx.clearRect(0,0,W,H);drawRest();}
}
function kick(){if(reduced)return;if(!raf){last=performance.now();raf=requestAnimationFrame(loop);}}
function stopFx(){if(raf)cancelAnimationFrame(raf);raf=0;P.length=0;REST.length=0;rainT=0;ctx.clearRect(0,0,W,H);}

function drawStatic(){
  ctx.clearRect(0,0,W,H);
  var n=phone()?26:52,i;
  for(i=0;i<n;i++){
    var left=i%2===0,x=left?R(0,W*.32):W-R(0,W*.32),y=H-R(4,H*.28)*Math.random();
    drawPetal(x,y,R(0,6.28),R(.35,1),R(10,17),R(13,21),PET[i%PET.length],R(.6,.95));
  }
  for(i=0;i<(phone()?40:80);i++){ctx.globalAlpha=R(.4,.9);ctx.fillStyle='hsl('+GH[i%GH.length]+',72%,70%)';ctx.fillRect(R(0,W),R(0,H),R(.8,1.8),R(.8,1.8));}
  ctx.globalAlpha=1;
}

/* ---------- sound (only after a click) ---------- */
function ac(){
  if(!actx){var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;actx=new A();}
  if(actx.state==='suspended')actx.resume();return actx;
}
function noise(a){if(nbuf)return nbuf;var len=a.sampleRate,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;nbuf=b;return b;}
function puff(delay,dur,up){
  if(!soundOn)return;var a=ac();if(!a)return;var t=a.currentTime+(delay||0);dur=dur||.9;
  var s=a.createBufferSource();s.buffer=noise(a);s.loop=true;var f=a.createBiquadFilter();f.type='lowpass';f.Q.value=.7;
  f.frequency.setValueAtTime(up?500:1800,t);f.frequency.exponentialRampToValueAtTime(up?2600:420,t+dur);
  var g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+dur+.05);
}
function tinkle(delay,n){
  if(!soundOn)return;var a=ac();if(!a)return;var t0=a.currentTime+(delay||0),sc=[2093,2349,2637,3136,3520,4186];
  for(var i=0;i<(n||7);i++){
    var t=t0+i*R(.04,.09),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=sc[(Math.random()*sc.length)|0];
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.018,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.35);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.4);
  }
}
function chime(delay){
  if(!soundOn)return;var a=ac();if(!a)return;var t0=a.currentTime+(delay||0),notes=[784,987.8,1174.7,1568];
  notes.forEach(function(fr,i){
    var t=t0+i*.14,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=fr;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.035,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+2.3);
  });
}

/* ---------- sequence ---------- */
var SEQ=['oval','scr','name','sub','cta','sign'];
function at(ms,fn){timers.push(setTimeout(fn,ms));}
function clearT(){timers.forEach(clearTimeout);timers=[];}
function showAll(){SEQ.forEach(function(k){E[k].classList.add('on');});skipB.hidden=true;}
function play(){
  clearT();stopFx();state='intro';swirl=false;
  done.hidden=true;stage.hidden=false;ctrl.hidden=false;skipB.hidden=false;stage.classList.remove('leaving');veil.classList.remove('on');
  SEQ.forEach(function(k){E[k].classList.remove('on');});
  void stage.offsetWidth;
  if(reduced){drawStatic();at(40,showAll);return;}
  var ph=phone();
  at(80,function(){E.oval.classList.add('on');});
  at(350,function(){blast(0,ph?4:8,ph?12:22,.55);blast(1,ph?4:8,ph?12:22,.55);kick();tinkle(0,5);});
  at(950,function(){blast(0,ph?60:140,ph?35:80,1);blast(1,ph?60:140,ph?35:80,1);kick();puff(0,1.1);tinkle(.15,9);});
  at(1500,function(){E.scr.classList.add('on');});
  at(1750,function(){blast(0,ph?20:45,ph?12:25,.8);blast(1,ph?20:45,ph?12:25,.8);kick();puff(0,.8);});
  at(2400,function(){E.name.classList.add('on');rainT=3.5;kick();});
  at(2700,function(){blast(0,ph?14:30,ph?10:20,.7);blast(1,ph?14:30,ph?10:20,.7);kick();tinkle(0,6);});
  at(3150,function(){E.sub.classList.add('on');chime(0);});
  at(3800,function(){E.cta.classList.add('on');E.sign.classList.add('on');skipB.hidden=true;});
}
function skip(){
  if(state!=='intro')return;clearT();showAll();
  if(!reduced){rainT=Math.max(rainT,2.5);kick();}
